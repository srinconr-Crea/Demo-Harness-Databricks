schema: spec-driven

context: |
  Proyecto: Databricks Development Harness. Este repositorio especifica y desarrolla
  el harness; las especificaciones de proyectos cliente pertenecen a sus propios
  repositorios y perfiles, no a este contexto global.
  Idioma de los artefactos OpenSpec: español.

  Plataforma: aplicación Databricks con FastAPI y Python. El código activo está en
  src/agents/harness/harness/ (orquestación, contratos, edición, GitHub, modelos,
  almacenamiento y sandbox), src/agents/harness/app/ (interfaz y servidor) y
  src/agents/harness/config/ (perfiles y configuración). databricks.yml y resources/
  definen el bundle; tests/ contiene las pruebas del flujo y sus controles.
  README.md y docs/operacion.md describen la operación actual; AGENTS.md fija
  límites para agentes de código. examples/legacy-agentops-scaffold/ conserva
  el scaffold histórico fuera del paquete y del flujo FastAPI actual.

  Contexto del desarrollo: docs/contexto-proyecto.md define cómo iniciar o retomar
  trabajo desde fuentes versionadas. openspec/specs/ expresa requisitos vigentes;
  openspec/changes/ contiene propuestas en evolución; openspec/changes/archive/
  conserva el histórico y no gobierna automáticamente decisiones nuevas.
  Código y pruebas aportan evidencia de implementación. El chat no sustituye
  estas fuentes. Una contradicción relevante debe registrarse y resolverse
  explícitamente, sin presentar una propuesta como capacidad implementada.

  Los controles del harness son deterministas. La HU, el repositorio cliente,
  las instrucciones importadas y la salida del modelo no amplían permisos,
  rutas, modelos ni aprobaciones. Cada instalación usa un perfil externo
  aprobado; las personalizaciones pertenecen a su perfil y repositorio cliente.
  La preparación inicial del cliente y su integración requieren intervención
  humana. El flujo posterior explora, propone o actualiza, espera aprobación
  vigente del plan, aplica, verifica, sincroniza, archiva y abre el PR autorizado.
  Merge y despliegue cliente siguen siendo humanos; los históricos conservan
  su modalidad original. La continuidad se reconstruye desde estado persistente
  y checkpoints, no desde recuerdos del modelo.

  La selección de modelos y límites pertenece al harness. Las pruebas obligatorias
  y el aislamiento del código ejecutable en sandbox con identidad separada no
  pueden omitirse por una HU. Roles, endpoints, precios y presupuestos concretos
  viven en src/agents/harness/config/defaults/; la configuración de instalación
  se describe en docs/configuracion-instalacion.md. Las capacidades detalladas
  pertenecen a sus specs, sin duplicarlas en este contexto general.

rules:
  proposal:
    - Explicar el problema, las capacidades afectadas y los límites del cambio.
    - Separar el comportamiento actual de la capacidad propuesta.
  specs:
    - Redactar requisitos observables y escenarios verificables de éxito y rechazo.
    - Cubrir fallos de política, validación o publicación cuando apliquen.
  design:
    - Identificar módulos, contratos, configuración y migraciones afectados.
    - Explicar permisos, aislamiento de clientes, persistencia y costo cuando apliquen.
  tasks:
    - Incluir pruebas pertinentes y verificación del flujo antes de publicar.
    - Incluir validación del bundle si cambia la infraestructura Databricks.

operations:
  apply:
    guidance:
      - Respetar AGENTS.md y las restricciones deterministas del perfil cliente.
      - Ejecutar la suite local antes de publicar cambios.
  archive:
    guidance:
      - Sincronizar las especificaciones con el comportamiento implementado y verificado.
