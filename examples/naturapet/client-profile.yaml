name: naturapet
version: '3'
repository: srinconr-Crea/Naturapet_DLH
base_branch: develop
github_app_id: 5075619
github_installation_id: 164865183
ui:
  display_name: NaturaPet
openspec_root: openspec
repository_policy:
  scope: repository
  read_only_paths:
  - .github/
  - .agents/
  - openspec/
  - AGENTS.md
  denied_paths:
  - .databricks/
  - .venv/
  - node_modules/
  - data/
  - datasets/
  - private/
  max_searches: 20
  max_reads: 50
  max_context_bytes: 400000
  max_file_bytes: 150000
  max_rounds: 30
  timeout_seconds: 120
openspec_skills:
  compatible_versions:
  - 1.13.2
  max_skill_bytes: 131072
  max_catalog_bytes: 1048576
  max_prompt_bytes: 1048576
general_patch:
  operations:
  - create
  - modify
  - delete
  extensions:
  - .py
  - .sql
  - .ipynb
  - .yml
  - .yaml
  - .json
  - .toml
  - .md
  - .txt
  max_files: 40
  max_bytes: 2000000
  test_adapters:
  - python_compile
  - pytest_sandbox
  - sql_lint
  - yaml_validate
  - json_validate
  - notebook_validate
  - databricks_bundle_validate
  - toml_validate
  - markdown_structure
  - text_validate
  test_paths:
  - tests
  bundle_target: dev
  bundle_paths:
  - databricks.yml
  - resources/
  impact_rules:
  - paths:
    - src/
    - notebooks/
    - conf/
    - tests/
    test_paths:
    - tests
    adapters:
    - pytest_sandbox
