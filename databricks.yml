bundle:
  name: demo_harness_databricks
  engine: direct

variables:
  catalog:
    description: Unity Catalog for project resources (overridden per target)
  schema:
    description: Schema within the catalog for resources, traces, and artifacts
    default: demo_harness_databricks
  catalog_storage_root:
    description: Dedicated managed storage root for the harness catalog
  app_name:
    description: Databricks App managed by this bundle
  client_profile:
    description: YAML client profile selected at runtime
  warehouse_id:
    description: Isolated SQL warehouse for synthetic validation
  sonnet_endpoint:
    description: Foundation Model API endpoint for OpenSpec planner and developer
  verifier_endpoint:
    description: Foundation Model API endpoint for verifier
  github_secret_scope:
    description: Scope containing the GitHub App private key
  github_secret_key:
    description: Key containing the GitHub App private key
  sandbox_service_principal:
    description: Dedicated service principal application ID for the client-code test Job
    default: SET_DEDICATED_SANDBOX_SERVICE_PRINCIPAL


include:
  - ./resources/catalog.yml
  - ./resources/experiment.yml
  - ./resources/schemas.yml
  - ./resources/volumes.yml
  - ./resources/sandbox_job.yml





resources:
  apps:
    harness:
      name: ${var.app_name}
      description: "harness agent — demo_harness_databricks"
      user_api_scopes:
        - apps
      source_code_path: ./src/agents/harness
      config:
        command: ["uv", "run", "--no-dev", "python", "app/start_server.py"]
        env:
          - name: RUN_STORE_DIR
            value: /Volumes/${resources.volumes.artifacts.catalog_name}/${resources.volumes.artifacts.schema_name}/${resources.volumes.artifacts.name}/runs
          - name: HARNESS_CLIENT_PROFILE
            value: ${var.client_profile}
          - name: HARNESS_APP_NAME
            value: ${var.app_name}
          - name: GITHUB_APP_PRIVATE_KEY
            value_from: github-private-key
          - name: HARNESS_WAREHOUSE_ID
            value_from: sandbox-warehouse
          - name: HARNESS_RUN_STATE_TABLE
            value_from: run-state-table
          - name: HARNESS_SANDBOX_JOB_ID
            value_from: sandbox-job
          - name: HARNESS_SANDBOX_DIR
            value: /Volumes/${resources.volumes.sandbox.catalog_name}/${resources.volumes.sandbox.schema_name}/${resources.volumes.sandbox.name}
      resources:
        - name: github-private-key
          secret:
            scope: ${var.github_secret_scope}
            key: ${var.github_secret_key}
            permission: READ
        - name: sonnet-five
          serving_endpoint:
            name: ${var.sonnet_endpoint}
            permission: CAN_QUERY
        - name: haiku-four-five
          serving_endpoint:
            name: ${var.verifier_endpoint}
            permission: CAN_QUERY
        - name: sandbox-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: run-records-read
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${resources.volumes.artifacts.catalog_name}.${resources.volumes.artifacts.schema_name}.${resources.volumes.artifacts.name}
            permission: READ_VOLUME
        - name: run-records-write
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${resources.volumes.artifacts.catalog_name}.${resources.volumes.artifacts.schema_name}.${resources.volumes.artifacts.name}
            permission: WRITE_VOLUME
        - name: run-state-table
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${resources.schemas.project_schema.catalog_name}.${resources.schemas.project_schema.name}.demo_harness_run_state
            permission: MODIFY
        - name: run-state-table-read
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${resources.schemas.project_schema.catalog_name}.${resources.schemas.project_schema.name}.demo_harness_run_state
            permission: SELECT
        - name: sandbox-job
          job:
            id: ${resources.jobs.demo_harness_sandbox.id}
            permission: CAN_MANAGE_RUN
        - name: sandbox-volume-write
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${resources.volumes.sandbox.catalog_name}.${resources.volumes.sandbox.schema_name}.${resources.volumes.sandbox.name}
            permission: WRITE_VOLUME
        - name: sandbox-volume-read
          uc_securable:
            securable_type: VOLUME
            securable_full_name: ${resources.volumes.sandbox.catalog_name}.${resources.volumes.sandbox.schema_name}.${resources.volumes.sandbox.name}
            permission: READ_VOLUME


sync:
  include:
    - src/agents/**
  exclude:
    - .playwright-cli/**
    - .ui-preview-data/**
    - ui_preview_local.py
    - src/agents/**/__pycache__/**
    - src/agents/**/*.pyc
    - src/agents/**/.venv/**
    - src/agents/**/node_modules/**

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405606739630987.7.azuredatabricks.net
    variables:
      catalog: demo_harness_databricks_dev
      catalog_storage_root: abfss://demo@demodldb.dfs.core.windows.net/harness/demo_harness_databricks_dev
      app_name: demo-dbx-harness-mvp
      client_profile: naturapet
      warehouse_id: 9e696889dea65361
      sonnet_endpoint: databricks-claude-sonnet-5
      verifier_endpoint: databricks-claude-haiku-4-5
      github_secret_scope: demo-harness-databricks
      github_secret_key: github-app-private-key
