spec_version: 1
name: governance_probe
description: Prueba aislada de decisiones de política en un remoto Git local.
executor:
  type: omnigent
  config:
    harness: codex
prompt: |
  Actúa solamente en el repositorio local de prueba. Ejecuta exactamente
  la solicitud del usuario, sin sustituirla por otra operación. Si una
  política rechaza o pide aprobación, detente e informa la decisión.
os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: auto
guardrails:
  policies:
    blast_radius:
      type: function
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: true
