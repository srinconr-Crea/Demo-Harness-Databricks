[project]
name = "demo-harness-databricks"
version = "0.1.0"
description = "AgentOps Stacks based Databricks development harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.129.0",
  "uvicorn>=0.41.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "databricks-sdk>=0.50.0",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.9.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
eval = ["mlflow>=3.10.0", "databricks-langchain>=0.17.0", "databricks-agents>=1.9.3", "langgraph>=1.1.0"]
