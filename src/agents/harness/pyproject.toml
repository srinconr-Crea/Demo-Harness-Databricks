[project]
name = "demo-harness-databricks"
version = "0.1.0"
description = "AgentOps Stacks based Databricks development harness"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.129.0",
  "uvicorn>=0.41.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "databricks-sdk>=0.50.0",
  "httpx>=0.27.0",
  "PyJWT[crypto]>=2.9.0",
  "sqlglot==27.14.0",
  "nbformat==5.10.4",
  "jsonschema==4.23.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]
spark-validation = ["pyspark>=3.5,<4"]
