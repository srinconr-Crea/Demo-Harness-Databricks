name: naturapet
version: "3"
repository: srinconr-Crea/Naturapet_DLH
base_branch: develop
github_app_id: 5075619
github_installation_id: 164865183
ui:
  display_name: NaturaPet
  architecture_hint: "Dominio y componente afectado: comercial, operaciones, finanzas, gobierno o shared; Bronze, Silver, Gold, src, conf, recursos o documentación"
  source_target_hint: "Archivos, módulos, notebooks, configuraciones y tablas involucrados; comportamiento actual y esperado"
  business_rules_hint: "Reglas funcionales, entradas/salidas, compatibilidad, calidad de datos y casos límite; sin restringir la HU a ratios"
  validation_hint: "Criterios de aceptación y pruebas sintéticas del componente; regresiones en tests/; sin ejecutar recursos NaturaPet"
openspec_root: openspec
repository_policy:
  scope: repository
  read_only_paths: [.github/, .agents/, openspec/, AGENTS.md]
  denied_paths: [.databricks/, .venv/, node_modules/, data/, datasets/, private/]
  max_searches: 20
  max_reads: 50
  max_context_bytes: 400000
  max_file_bytes: 150000
  max_rounds: 30
  timeout_seconds: 120
openspec_skills:
  compatible_versions: ["1.13.2"]
  max_skill_bytes: 131072
  max_catalog_bytes: 1048576
  max_prompt_bytes: 1048576
general_patch:
  operations: [create, modify, delete]
  extensions: [.py, .sql, .ipynb, .yml, .yaml, .json, .toml, .md, .txt]
  max_files: 40
  max_bytes: 2000000
  test_adapters: [python_compile, pytest_sandbox, sql_lint, yaml_validate, json_validate, notebook_validate, databricks_bundle_validate, toml_validate, markdown_structure, text_validate]
  test_paths: [tests]
  # Target existente del cliente; solo validate, nunca deploy/run.
  # Requiere CLI y autenticación aislada provisionadas en el Job sandbox.
  bundle_target: dev
  bundle_paths: [databricks.yml, resources/]
  impact_rules:
    - paths: [src/, notebooks/, conf/, tests/]
      test_paths: [tests]
      adapters: [pytest_sandbox]
